spring:
  datasource:
    url: jdbc:h2:mem:taskdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  sql:
    init:
      mode: always

mybatis:
  type-aliases-package: com.example.taskapi.entity
  configuration:
    map-underscore-to-camel-case: true
